<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>경기도 학교 지도</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

h1 {
  text-align: center;
}

#map {
  width: 100%;
  height: 650px;
  border-radius: 15px;
}

</style>


<!-- ★ services 라이브러리 추가 -->

<script
  src="//dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_JavaScript키&libraries=services">
</script>

</head>


<body>


<div class="wrap">

<h1>경기도 학교 운영 현황</h1>

<div id="map"></div>

</div>


<script>


/* =============================

   1. 지도 생성

============================= */


const mapContainer =
  document.getElementById("map");


const mapOption = {

  // 경기도 중심 부근
  center:
    new kakao.maps.LatLng(
      37.4138,
      127.5183
    ),

  level: 10

};


const map =
  new kakao.maps.Map(
    mapContainer,
    mapOption
  );



/* =============================

   2. 학교 데이터

   위도·경도 필요 없음

============================= */


const schools = [

  {

    name:
      "A초등학교",

    address:
      "경기도 수원시 영통구 월드컵로 206",

    info:
      "AI 디지털 활용 운영학교"

  },


  {

    name:
      "B중학교",

    address:
      "경기도 성남시 분당구 판교역로 166",

    info:
      "디지털 시민교육 운영학교"

  },


  {

    name:
      "C고등학교",

    address:
      "경기도 용인시 수지구 포은대로 435",

    info:
      "디지털튜터 운영학교"

  }

];



/* =============================

   3. 주소 → 좌표 변환 객체

============================= */


const geocoder =
  new kakao.maps.services.Geocoder();



/* =============================

   4. 각 학교 주소 검색

============================= */


schools.forEach(function(school) {


  geocoder.addressSearch(

    school.address,

    function(result, status) {


      /*
        주소 검색 성공
      */

      if (
        status ===
        kakao.maps.services.Status.OK
      ) {


        /*
          result[0].x = 경도
          result[0].y = 위도
        */


        const coords =
          new kakao.maps.LatLng(

            result[0].y,

            result[0].x

          );



        /*
          마커 생성
        */


        const marker =
          new kakao.maps.Marker({

            map:
              map,

            position:
              coords

          });



        /*
          학교 정보창
        */


        const content = `

          <div
            style="
              padding:12px;
              width:220px;
            "
          >

            <strong
              style="
                font-size:16px;
              "
            >

              ${school.name}

            </strong>

            <br><br>

            ${school.info}

            <br><br>

            <small>

              ${school.address}

            </small>

          </div>

        `;



        const infowindow =
          new kakao.maps.InfoWindow({

            content:
              content

          });



        /*
          마커 클릭

          → 학교 정보 표시
        */


        kakao.maps.event.addListener(

          marker,

          "click",

          function() {

            infowindow.open(
              map,
              marker
            );

          }

        );


      }



      /*
        주소 검색 실패
      */


      else {

        console.log(

          "주소 검색 실패:",

          school.name,

          school.address

        );

      }


    }

  );


});


</script>


</body>

</html>
