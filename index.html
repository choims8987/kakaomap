<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>학교 위치 지도</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }

    #map {
      width: 100%;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
  </style>

  <!-- 카카오맵 JavaScript API -->
  <script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c1c66f3e22d9d8d47c4145688832070d">
  </script>

</head>

<body>

<div class="wrap">

  <h1>경기도 학교 위치 지도</h1>

  <div class="description">
    지도에서 학교 마커를 클릭하면 학교 정보를 확인할 수 있습니다.
  </div>

  <div id="map"></div>

</div>

<script>

  /*
    1. 지도 생성
  */

  const mapContainer =
    document.getElementById("map");

  const mapOption = {

    center:
      new kakao.maps.LatLng(
        37.4138,
        127.5183
      ),

    level: 10
  };

  const map =
    new kakao.maps.Map(
      mapContainer,
      mapOption
    );


  /*
    2. 학교 데이터

    실제 사용할 때
    학교명, 위도, 경도, 설명을
    원하는 만큼 추가하면 됩니다.
  */

  const schools = [

    {
      name: "경기초등학교",
      lat: 37.2636,
      lng: 127.0286,
      info: "AI 디지털 활용 교육 운영학교"
    },

    {
      name: "경기중학교",
      lat: 37.3943,
      lng: 126.9568,
      info: "디지털 시민교육 운영학교"
    },

    {
      name: "경기고등학교",
      lat: 37.7381,
      lng: 127.0337,
      info: "디지털 창의역량교육 운영학교"
    }

  ];


  /*
    3. 학교별 마커 생성
  */

  schools.forEach(function(school) {

    const markerPosition =
      new kakao.maps.LatLng(
        school.lat,
        school.lng
      );


    /*
      마커 생성
    */

    const marker =
      new kakao.maps.Marker({

        position:
          markerPosition

      });


    marker.setMap(map);


    /*
      학교 정보창 생성
    */

    const content = `

      <div
        style="
          padding:12px;
          min-width:200px;
          font-size:14px;
        "
      >

        <strong
          style="
            font-size:16px;
          "
        >
          ${school.name}
        </strong>

        <br><br>

        ${school.info}

      </div>

    `;


    const infowindow =
      new kakao.maps.InfoWindow({

        content:
          content

      });


    /*
      마커 클릭 시
      학교 정보 표시
    */

    kakao.maps.event.addListener(

      marker,

      "click",

      function() {

        infowindow.open(
          map,
          marker
        );

      }

    );

  });

</script>

</body>
</html>
