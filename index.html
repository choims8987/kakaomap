<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>경기도 학교 위치 검색</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #schoolSearch {
      width: 300px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #searchBtn {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      min-height: 24px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 650px;
      border-radius: 15px;
      overflow: hidden;
    }

  </style>


  <!--
    ★ YOUR_JAVASCRIPT_KEY를
    본인의 카카오 JavaScript 키로 변경하세요.
  -->

  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c1c66f3e22d9d8d47c4145688832070d&libraries=services">
  </script>

</head>


<body>


<div class="container">

  <h1>🏫 경기도 학교 위치 검색</h1>

  <div class="description">
    경기도 내 학교명을 검색해 보세요.
  </div>


  <div class="search-box">

    <input
      type="text"
      id="schoolSearch"
      placeholder="예: 신백현초등학교">

    <button id="searchBtn">
      검색
    </button>

  </div>


  <div id="message"></div>


  <div id="map"></div>

</div>



<script>


/* ==========================================
   1. 지도 생성
========================================== */


const mapContainer =
  document.getElementById("map");


const mapOption = {

  // 경기도 중심 부근
  center:
    new kakao.maps.LatLng(
      37.4138,
      127.5183
    ),

  level: 10

};


const map =
  new kakao.maps.Map(
    mapContainer,
    mapOption
  );



/* ==========================================
   2. 카카오 장소검색 객체
========================================== */


const places =
  new kakao.maps.services.Places();



/* ==========================================
   3. 현재 표시 중인 마커와 팝업
========================================== */


let currentMarker = null;

let currentInfoWindow = null;



/* ==========================================
   4. 정보창 닫기
========================================== */


function closeInfoWindow() {

  if (currentInfoWindow) {

    currentInfoWindow.close();

    currentInfoWindow = null;

  }

}



/* ==========================================
   5. 기존 마커 제거
========================================== */


function removeMarker() {

  if (currentMarker) {

    currentMarker.setMap(null);

    currentMarker = null;

  }

}



/* ==========================================
   6. 학교 검색
========================================== */


function searchSchool() {


  const input =
    document
      .getElementById("schoolSearch")
      .value
      .trim();


  const message =
    document.getElementById("message");


  if (input === "") {

    message.textContent =
      "학교명을 입력해주세요.";

    return;

  }


  /*
    ★ 핵심

    사용자가
    신백현초등학교

    라고 입력하면

    실제 검색어는

    경기도 신백현초등학교

    가 됩니다.
  */


  const keyword =
    "경기도 " + input;


  message.textContent =
    "학교를 검색하고 있습니다...";


  closeInfoWindow();

  removeMarker();



  /*
    카카오 장소 검색
  */


  places.keywordSearch(

    keyword,

    function(data, status) {


      if (
        status ===
        kakao.maps.services.Status.OK
      ) {


        /*
          검색 결과 중
          주소가 경기도인 장소만 선택
        */


        const school =
          data.find(function(place) {


            const address =
              place.road_address_name ||
              place.address_name ||
              "";


            return (
              address.includes("경기")
            );


          });



        /*
          경기도 결과가 없을 경우
        */


        if (!school) {

          message.textContent =
            "경기도 내에서 해당 학교를 찾을 수 없습니다.";

          return;

        }



        /*
          학교 위치
        */


        const position =
          new kakao.maps.LatLng(

            school.y,

            school.x

          );



        /*
          마커 생성
        */


        currentMarker =
          new kakao.maps.Marker({

            map: map,

            position: position

          });



        /*
          해당 학교로 지도 이동
        */


        map.panTo(
          position
        );


        /*
          확대
        */


        map.setLevel(4);



        /*
          팝업 내용
        */


        const content = `

          <div
            style="
              padding:14px 18px;
              min-width:200px;
            "
          >

            <strong
              style="
                font-size:17px;
              "
            >

              ${school.place_name}

            </strong>

            <br><br>

            <span
              style="
                font-size:13px;
                color:#555;
              "
            >

              ${
                school.road_address_name ||
                school.address_name
              }

            </span>

          </div>

        `;



        /*
          정보창 생성
        */


        currentInfoWindow =
          new kakao.maps.InfoWindow({

            content: content

          });



        /*
          검색과 동시에 팝업 열기
        */


        currentInfoWindow.open(

          map,

          currentMarker

        );



        /*
          안내문
        */


        message.textContent =
          school.place_name +
          "을(를) 찾았습니다.";



        /*
          마커 클릭

          팝업이 열려 있으면 닫고
          닫혀 있으면 다시 열기
        */


        kakao.maps.event.addListener(

          currentMarker,

          "click",

          function() {


            if (currentInfoWindow) {


              closeInfoWindow();


            } else {


              currentInfoWindow =
                new kakao.maps.InfoWindow({

                  content: content

                });


              currentInfoWindow.open(

                map,

                currentMarker

              );


            }


          }

        );


      }



      /*
        검색 결과 없음
      */


      else if (

        status ===
        kakao.maps.services.Status.ZERO_RESULT

      ) {


        message.textContent =
          "경기도 내에서 해당 학교를 찾을 수 없습니다.";


      }



      /*
        기타 오류
      */


      else {


        message.textContent =
          "학교 검색 중 오류가 발생했습니다.";


      }


    }

  );


}



/* ==========================================
   7. 검색 버튼
========================================== */


document
  .getElementById("searchBtn")
  .addEventListener(

    "click",

    searchSchool

  );



/* ==========================================
   8. Enter 키 검색
========================================== */


document
  .getElementById("schoolSearch")
  .addEventListener(

    "keydown",

    function(event) {


      if (
        event.key === "Enter"
      ) {

        searchSchool();

      }


    }

  );



/* ==========================================
   9. 지도 빈 곳 클릭

   → 팝업 닫기
========================================== */


kakao.maps.event.addListener(

  map,

  "click",

  function() {

    closeInfoWindow();

  }

);


</script>


</body>

</html>
