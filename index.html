<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>경기도 학교 위치 검색</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #schoolSearch {
      width: 300px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #searchBtn {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      min-height: 24px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 650px;
      border-radius: 15px;
      overflow: hidden;
    }

  </style>


  <!--
    YOUR_JAVASCRIPT_KEY 부분을
    본인의 카카오 JavaScript 키로 바꾸세요.
  -->

  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY&libraries=services">
  </script>

</head>


<body>


<div class="container">

  <h1>🏫 경기도 학교 위치 검색</h1>

  <div class="description">
    경기도 내 학교명을 검색해 보세요.
  </div>


  <div class="search-box">

    <input
      type="text"
      id="schoolSearch"
      placeholder="예: 신백현초등학교">

    <button id="searchBtn">
      검색
    </button>

  </div>


  <div id="message"></div>


  <div id="map"></div>

</div>



<script>


/* ==========================================
   1. 지도 생성
========================================== */


const mapContainer =
  document.getElementById("map");


const mapOption = {

  center:
    new kakao.maps.LatLng(
      37.4138,
      127.5183
    ),

  level: 10

};


const map =
  new kakao.maps.Map(
    mapContainer,
    mapOption
  );



/* ==========================================
   2. 카카오 장소 검색 객체
========================================== */


const places =
  new kakao.maps.services.Places();



/* ==========================================
   3. 현재 마커 / 정보창
========================================== */


let currentMarker = null;

let currentInfoWindow = null;



/* ==========================================
   4. CSV에서 읽은 학교 설명 저장
========================================== */


const schoolDescriptions = {};



/* ==========================================
   5. CSV 불러오기
========================================== */


async function loadSchoolDescriptions() {

  try {

    const response =
      await fetch("schools.csv");


    const text =
      await response.text();


    const lines =
      text
        .trim()
        .split(/\r?\n/);


    /*
      첫 번째 줄은

      학교명,설명

      이므로 제외
    */


    for (let i = 1; i < lines.length; i++) {


      /*
        첫 번째 쉼표만 기준으로 분리

        설명 안에 쉼표가 들어가도
        최대한 유지하기 위한 방식
      */


      const firstComma =
        lines[i].indexOf(",");


      if (firstComma === -1) {
        continue;
      }


      const schoolName =
        lines[i]
          .substring(
            0,
            firstComma
          )
          .trim();


      const description =
        lines[i]
          .substring(
            firstComma + 1
          )
          .trim();


      schoolDescriptions[schoolName] =
        description;

    }


    console.log(
      "학교 설명 불러오기 완료",
      schoolDescriptions
    );


  } catch (error) {


    console.error(
      "schools.csv 불러오기 실패",
      error
    );


  }

}



/* ==========================================
   6. 정보창 닫기
========================================== */


function closeInfoWindow() {


  if (currentInfoWindow) {


    currentInfoWindow.close();

    currentInfoWindow = null;


  }


}



/* ==========================================
   7. 기존 마커 제거
========================================== */


function removeMarker() {


  if (currentMarker) {


    currentMarker.setMap(null);

    currentMarker = null;


  }


}



/* ==========================================
   8. 학교 검색
========================================== */


function searchSchool() {


  const input =
    document
      .getElementById("schoolSearch")
      .value
      .trim();


  const message =
    document.getElementById("message");


  if (input === "") {


    message.textContent =
      "학교명을 입력해주세요.";


    return;

  }


  /*
    경기도 학교 우선 검색
  */


  const keyword =
    "경기도 " + input;


  message.textContent =
    "학교를 검색하고 있습니다...";


  closeInfoWindow();

  removeMarker();



  places.keywordSearch(

    keyword,

    function(data, status) {


      if (
        status ===
        kakao.maps.services.Status.OK
      ) {


        /*
          검색 결과 중
          경기도 주소인 학교 찾기
        */


        const school =
          data.find(function(place) {


            const address =
              place.road_address_name ||
              place.address_name ||
              "";


            return (
              address.includes("경기")
            );


          });



        if (!school) {


          message.textContent =
            "경기도 내에서 해당 학교를 찾을 수 없습니다.";


          return;

        }



        /*
          학교 좌표
        */


        const position =
          new kakao.maps.LatLng(

            school.y,

            school.x

          );



        /*
          마커 생성
        */


        currentMarker =
          new kakao.maps.Marker({

            map: map,

            position: position

          });



        /*
          지도 이동 및 확대
        */


        map.panTo(position);

        map.setLevel(4);



        /*
          CSV 설명 찾기

          정확한 학교명이 일치하면
          설명을 가져옴
        */


        const schoolDescription =
          schoolDescriptions[
            school.place_name
          ] ||
          "등록된 학교 설명이 없습니다.";



        /*
          팝업 내용
        */


        const content = `

          <div
            style="
              padding:16px 18px;
              min-width:240px;
              max-width:320px;
              line-height:1.5;
            "
          >

            <strong
              style="
                font-size:18px;
              "
            >

              ${school.place_name}

            </strong>


            <br><br>


            <span
              style="
                font-size:13px;
                color:#666;
              "
            >

              ${
                school.road_address_name ||
                school.address_name
              }

            </span>


            <br><br>


            <div
              style="
                font-size:14px;
                color:#333;
              "
            >

              ${schoolDescription}

            </div>

          </div>

        `;



        /*
          정보창 생성
        */


        currentInfoWindow =
          new kakao.maps.InfoWindow({

            content: content

          });



        /*
          정보창 열기
        */


        currentInfoWindow.open(

          map,

          currentMarker

        );



        message.textContent =
          school.place_name +
          "을(를) 찾았습니다.";



        /*
          마커 클릭 시
          정보창 열기 / 닫기
        */


        kakao.maps.event.addListener(

          currentMarker,

          "click",

          function() {


            if (currentInfoWindow) {


              closeInfoWindow();


            } else {


              currentInfoWindow =
                new kakao.maps.InfoWindow({

                  content: content

                });


              currentInfoWindow.open(

                map,

                currentMarker

              );


            }


          }

        );


      }



      else if (

        status ===
        kakao.maps.services.Status.ZERO_RESULT

      ) {


        message.textContent =
          "경기도 내에서 해당 학교를 찾을 수 없습니다.";


      }



      else {


        message.textContent =
          "학교 검색 중 오류가 발생했습니다.";


      }


    }

  );


}



/* ==========================================
   9. 검색 버튼
========================================== */


document
  .getElementById("searchBtn")
  .addEventListener(

    "click",

    searchSchool

  );



/* ==========================================
   10. Enter 키 검색
========================================== */


document
  .getElementById("schoolSearch")
  .addEventListener(

    "keydown",

    function(event) {


      if (
        event.key === "Enter"
      ) {


        searchSchool();


      }


    }

  );



/* ==========================================
   11. 지도 빈 곳 클릭

   → 팝업 닫기
========================================== */


kakao.maps.event.addListener(

  map,

  "click",

  function() {


    closeInfoWindow();


  }

);



/* ==========================================
   12. 페이지 시작 시 CSV 불러오기
========================================== */


loadSchoolDescriptions();


</script>


</body>

</html>
