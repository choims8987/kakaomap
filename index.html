<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>학교 위치 지도</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }

    #map {
      width: 100%;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
  </style>

  <!-- 카카오맵 JavaScript API -->
  <script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c1c66f3e22d9d8d47c4145688832070d&libraries=services">
  </script>

</head>

<body>

<div class="wrap">

  <h1>경기도 학교 위치 지도</h1>

  <div class="description">
    지도에서 학교 마커를 클릭하면 학교 정보를 확인할 수 있습니다.
  </div>

  <div id="map"></div>

</div>

<script>

  /*
    1. 지도 생성
  */

  const mapContainer =
    document.getElementById("map");

  const mapOption = {

    center:
      new kakao.maps.LatLng(
        37.4138,
        127.5183
      ),

    level: 10
  };

  const map =
    new kakao.maps.Map(
      mapContainer,
      mapOption
    );


  /*
    2. 학교 데이터

    실제 사용할 때
    학교명, 위도, 경도, 설명을
    원하는 만큼 추가하면 됩니다.
  */

  const schools = [

     {
    name: "대평중교",
    address: "경기 수원시 장안구 정자동 871-1",
    info: "AI 디지털 활용 운영학교"
  },
  {
    name: "양오중학교",
    address: "경기 남양주시 오남읍 양지리 616-2",
    info: "디지털 시민교육 운영학교"
  },
  {
    name: "풍양중학교",
    address: "경기도 남양주시 진접읍 해밀예당1로 109 풍양중학교",
    info: "디지털튜터 운영학교"
  }

  ];


  /*
    3. 학교별 마커 생성
  */

  schools.forEach(function(school) {

    const markerPosition =
      new kakao.maps.LatLng(
        school.lat,
        school.lng
      );


 /* =============================

   3. 주소 → 좌표 변환 객체

============================= */


const geocoder =
  new kakao.maps.services.Geocoder();



/* =============================

   4. 각 학교 주소 검색

============================= */


schools.forEach(function(school) {


  geocoder.addressSearch(

    school.address,

    function(result, status) {


      /*
        주소 검색 성공
      */

      if (
        status ===
        kakao.maps.services.Status.OK
      ) {


        /*
          result[0].x = 경도
          result[0].y = 위도
        */


        const coords =
          new kakao.maps.LatLng(

            result[0].y,

            result[0].x

          );



        /*
          마커 생성
        */


        const marker =
          new kakao.maps.Marker({

            map:
              map,

            position:
              coords

          });



        /*
          학교 정보창
        */


        const content = `

          <div
            style="
              padding:12px;
              width:220px;
            "
          >

            <strong
              style="
                font-size:16px;
              "
            >

              ${school.name}

            </strong>

            <br><br>

            ${school.info}

            <br><br>

            <small>

              ${school.address}

            </small>

          </div>

        `;



        const infowindow =
          new kakao.maps.InfoWindow({

            content:
              content

          });



        /*
          마커 클릭

          → 학교 정보 표시
        */


        kakao.maps.event.addListener(

          marker,

          "click",

          function() {

            infowindow.open(
              map,
              marker
            );

          }

        );


      }



      /*
        주소 검색 실패
      */


      else {

        console.log(

          "주소 검색 실패:",

          school.name,

          school.address

        );

      }


    }

  );


});



</script>

</body>
</html>
